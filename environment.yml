# Entorno de gwsim: las versiones del entorno con el que se validó la equivalencia, solo los paquetes necesarios.
# conda env create -f environment.yml && conda activate gwsim
name: gwsim
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - numpy==2.2.6
      - scipy==1.15.3
      - h5py==3.16.0
      - pandas==2.3.3
      - astropy==6.1.7
      - lalsuite==7.26.11
      - PyCBC==2.9.0
      - matplotlib==3.10.9   # solo para los tutoriales
